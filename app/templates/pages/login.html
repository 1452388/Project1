{% extends "base.html" %}
{% block title %}登录 - 活码管理系统{% endblock %}

{% block extra_css %}
<style>
    body { margin: 0; padding: 0; background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80') center/cover no-repeat fixed; background-color: #1a1a2e; min-height: 100vh; }
    body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(15,12,41,0.85), rgba(48,43,99,0.85)); z-index: 0; }
    .bg-decoration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
    .bg-decoration .circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; }
    .bg-decoration .c1 { width: 400px; height: 400px; background: #6366f1; top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
    .bg-decoration .c2 { width: 300px; height: 300px; background: #06b6d4; bottom: -50px; left: -50px; animation: float 10s ease-in-out infinite reverse; }
    .bg-decoration .c3 { width: 200px; height: 200px; background: #f59e0b; top: 50%; left: 30%; animation: float 12s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-30px); } }
    .glass-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .glass-input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; }
    .glass-input::placeholder { color: rgba(255,255,255,0.5); }
    .glass-input:focus { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.3); }
    .glass-btn { background: linear-gradient(135deg, #4f46e5, #6366f1); transition: all 0.3s ease; }
    .glass-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79,70,229,0.4); }
    .glass-btn:active { transform: translateY(0); }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255,255,255,0.5); transition: color 0.2s; }
    .password-toggle:hover { color: rgba(255,255,255,0.8); }
    .fade-out { animation: fadeOut 0.5s forwards; }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.95); } }
</style>
{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center relative px-4 py-8" style="z-index: 2;">
    <div class="bg-decoration">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
    </div>

    <div id="loginCard" class="glass-card rounded-3xl p-6 sm:p-8 w-full max-w-md relative z-10">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-2xl mb-3 bg-gradient-to-br from-brand-500 to-cyan-500">
                <svg class="w-7 h-7 sm:w-8 sm:h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11H8m4 0v1m8-8h-1m-5.5 4.5l-5.5 5.5-3-3L2 9m16.5-2L20 4"/>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-white">活码管理系统</h1>
            <p class="text-white/50 text-sm mt-1">请登录您的账号</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-white/80 mb-1.5">用户名</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <input type="text" id="login-username" required class="glass-input w-full pl-10 pr-4 py-2.5 rounded-xl text-sm" placeholder="请输入用户名">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-white/80 mb-1.5">密码</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <input type="password" id="login-password" required class="glass-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm" placeholder="请输入密码">
                    <span class="password-toggle" onclick="togglePassword('login-password','eyeIcon1')">
                        <svg id="eyeIcon1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </span>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-white/20 bg-white/10 text-purple-500 focus:ring-purple-500 focus:ring-offset-0">
                    <span class="ml-2 text-sm text-white/70">记住我</span>
                </label>
                <button type="button" class="text-sm text-purple-400 hover:text-purple-300 transition-colors" onclick="alert('查找密码功能暂未开发，请联系管理员')">
                    忘记密码？
                </button>
            </div>
            <div id="login-error" class="hidden bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-2.5 rounded-xl text-sm"></div>
            <button type="submit" id="loginBtn" class="glass-btn w-full text-white font-medium py-2.5 rounded-xl text-sm">登录</button>
        </form>

        <div class="mt-5 flex items-center">
            <div class="flex-1 border-t border-white/10"></div>
            <span class="px-3 text-xs text-white/40">或</span>
            <div class="flex-1 border-t border-white/10"></div>
        </div>
        <button type="button" id="guestBtn" class="mt-4 w-full border border-white/20 hover:border-white/40 text-white/70 hover:text-white font-medium py-2.5 rounded-xl transition-all hover:bg-white/5 text-sm">
            游客浏览
        </button>

        <!-- 注册入口 -->
        <div class="mt-5 text-center">
            <span class="text-sm text-white/50">还没有账号？</span>
            <a href="/auth/register" class="text-sm text-purple-400 hover:text-purple-300 font-medium transition-colors">立即注册</a>
        </div>
    </div>
</div>

<script>
const nextUrl = {{ next_url|tojson }};

function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
    } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('remembered_user');
    if (saved) {
        document.getElementById('login-username').value = saved;
        document.getElementById('remember-me').checked = true;
    }
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('login-error');
    const card = document.getElementById('loginCard');
    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
    errorMsg.classList.add('hidden');
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    try {
        const resp = await fetch(`/auth/login?next=${encodeURIComponent(nextUrl)}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
        const result = await resp.json();
        if (resp.ok) {
            if (document.getElementById('remember-me').checked) { localStorage.setItem('remembered_user', username); } else { localStorage.removeItem('remembered_user'); }
            localStorage.setItem('token', result.token);
            localStorage.setItem('userId', result.user_id);
            localStorage.setItem('username', result.username);
            localStorage.setItem('role', result.role);
            fetch('/auth/log-login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: result.user_id, username: result.username, role: result.role }) }).catch(() => {});
            card.classList.add('fade-out');
            setTimeout(() => { window.location.href = result.redirect_to || nextUrl || '/'; }, 400);
        } else {
            errorMsg.textContent = result.detail || '登录失败，请重试';
            errorMsg.classList.remove('hidden');
        }
    } catch (err) {
        errorMsg.textContent = '网络错误，请稍后重试';
        errorMsg.classList.remove('hidden');
    } finally { btn.disabled = false; btn.innerHTML = '登录'; }
});

document.getElementById('guestBtn').addEventListener('click', async () => {
    const btn = document.getElementById('guestBtn');
    btn.disabled = true; btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
    try {
        const resp = await fetch(`/auth/login/guest?next=${encodeURIComponent(nextUrl)}`, { method: 'POST' });
        const result = await resp.json();
        if (resp.ok) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('userId', result.user_id);
            localStorage.setItem('username', result.username);
            localStorage.setItem('role', 'guest');
            fetch('/auth/log-login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: 0, username: 'guest', role: 'guest' }) }).catch(() => {});
            window.location.href = result.redirect_to || nextUrl || '/';
        }
    } catch (err) { alert('网络错误，请稍后重试'); }
    finally { btn.disabled = false; btn.innerHTML = '游客浏览'; }
});
</script>
{% endblock %}
