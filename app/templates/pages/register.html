{% extends "base.html" %}
{% block title %}注册 - 活码管理系统{% endblock %}

{% block extra_css %}
<style>
    body { margin: 0; padding: 0; background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80') center/cover no-repeat fixed; background-color: #1a1a2e; min-height: 100vh; }
    body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(15,12,41,0.85), rgba(48,43,99,0.85)); z-index: 0; }
    .bg-decoration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
    .bg-decoration .circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; }
    .bg-decoration .c1 { width: 400px; height: 400px; background: #6366f1; top: -100px; left: -100px; animation: float 8s ease-in-out infinite; }
    .bg-decoration .c2 { width: 300px; height: 300px; background: #06b6d4; bottom: -50px; right: -50px; animation: float 10s ease-in-out infinite reverse; }
    .bg-decoration .c3 { width: 200px; height: 200px; background: #f59e0b; top: 50%; left: 30%; animation: float 12s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-30px); } }
    .glass-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .glass-input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; }
    .glass-input::placeholder { color: rgba(255,255,255,0.5); }
    .glass-input:focus { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.3); }
    .glass-btn { background: linear-gradient(135deg, #4f46e5, #6366f1); transition: all 0.3s ease; }
    .glass-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79,70,229,0.4); }
    .glass-btn:active { transform: translateY(0); }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255,255,255,0.5); transition: color 0.2s; }
    .password-toggle:hover { color: rgba(255,255,255,0.8); }
    .fade-out { animation: fadeOut 0.5s forwards; }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.95); } }
    /* 密码强度条 */
    .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s; }
</style>
{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center relative px-4 py-8" style="z-index: 2;">
    <div class="bg-decoration">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
    </div>

    <div id="regCard" class="glass-card rounded-3xl p-6 sm:p-8 w-full max-w-md relative z-10">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-2xl mb-3 bg-gradient-to-br from-brand-500 to-cyan-500">
                <svg class="w-7 h-7 sm:w-8 sm:h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-white">创建账号</h1>
            <p class="text-white/50 text-sm mt-1">注册后即可使用完整功能</p>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-white/80 mb-1.5">用户名</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <input type="text" id="reg-username" required class="glass-input w-full pl-10 pr-4 py-2.5 rounded-xl text-sm" placeholder="3-20位字母、数字或下划线" minlength="3" maxlength="20">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-white/80 mb-1.5">密码</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <input type="password" id="reg-password" required class="glass-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm" placeholder="至少6位" minlength="6" oninput="checkStrength()">
                    <span class="password-toggle" onclick="togglePassword('reg-password','eyeIcon2')">
                        <svg id="eyeIcon2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </span>
                </div>
                <!-- 密码强度条 -->
                <div id="strength" class="mt-2 hidden">
                    <div class="flex gap-1 mb-1">
                        <div id="bar1" class="strength-bar flex-1 bg-white/10"></div>
                        <div id="bar2" class="strength-bar flex-1 bg-white/10"></div>
                        <div id="bar3" class="strength-bar flex-1 bg-white/10"></div>
                    </div>
                    <p id="strength-text" class="text-xs text-white/40"></p>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-white/80 mb-1.5">确认密码</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <input type="password" id="reg-password-confirm" required class="glass-input w-full pl-10 pr-4 py-2.5 rounded-xl text-sm" placeholder="请再次输入密码" minlength="6">
                </div>
                <p id="match-msg" class="text-xs mt-1 hidden"></p>
            </div>
            <div id="reg-error" class="hidden bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-2.5 rounded-xl text-sm"></div>
            <div id="reg-success" class="hidden bg-green-500/20 border border-green-500/30 text-green-300 px-4 py-2.5 rounded-xl text-sm"></div>
            <button type="submit" id="regBtn" class="glass-btn w-full text-white font-medium py-2.5 rounded-xl text-sm">注册</button>
        </form>

        <!-- 登录入口 -->
        <div class="mt-6 text-center">
            <span class="text-sm text-white/50">已有账号？</span>
            <a href="/auth/login" class="text-sm text-purple-400 hover:text-purple-300 font-medium transition-colors">立即登录</a>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
    } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    }
}

// 密码强度检测
function checkStrength() {
    const pwd = document.getElementById('reg-password').value;
    const strength = document.getElementById('strength');
    const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')];
    const text = document.getElementById('strength-text');
    if (!pwd) { strength.classList.add('hidden'); return; }
    strength.classList.remove('hidden');
    let score = 0;
    if (pwd.length >= 6) score++;
    if (pwd.length >= 10) score++;
    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    const level = score <= 2 ? 0 : score <= 3 ? 1 : 2;
    const colors = ['#ef4444', '#f59e0b', '#22c55e'];
    const labels = ['弱', '中', '强'];
    bars.forEach((b, i) => b.style.background = i <= level ? colors[level] : 'rgba(255,255,255,0.1)');
    text.textContent = '密码强度：' + labels[level];
    text.style.color = colors[level];
}

// 密码匹配检测
document.getElementById('reg-password-confirm').addEventListener('input', () => {
    const pwd = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-password-confirm').value;
    const msg = document.getElementById('match-msg');
    if (!confirm) { msg.classList.add('hidden'); return; }
    msg.classList.remove('hidden');
    if (pwd === confirm) {
        msg.textContent = '密码匹配';
        msg.style.color = '#22c55e';
    } else {
        msg.textContent = '密码不匹配';
        msg.style.color = '#ef4444';
    }
});

// 注册提交
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const errorMsg = document.getElementById('reg-error');
    const successMsg = document.getElementById('reg-success');
    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
    errorMsg.classList.add('hidden');
    successMsg.classList.add('hidden');
    const username = document.getElementById('reg-username').value;
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-password-confirm').value;
    if (password !== confirm) {
        errorMsg.textContent = '两次输入的密码不一致';
        errorMsg.classList.remove('hidden');
        btn.disabled = false; btn.innerHTML = '注册';
        return;
    }
    try {
        const resp = await fetch('/auth/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
        const result = await resp.json();
        if (resp.ok) {
            successMsg.textContent = '注册成功！即将跳转到登录页...';
            successMsg.classList.remove('hidden');
            document.getElementById('regCard').classList.add('fade-out');
            setTimeout(() => { window.location.href = '/auth/login'; }, 1500);
        } else {
            errorMsg.textContent = result.detail || '注册失败，请重试';
            errorMsg.classList.remove('hidden');
        }
    } catch (err) {
        errorMsg.textContent = '网络错误，请稍后重试';
        errorMsg.classList.remove('hidden');
    } finally { btn.disabled = false; btn.innerHTML = '注册'; }
});
</script>
{% endblock %}
