{% extends "base.html" %}
{% block title %}生成活码 - 活码管理系统{% endblock %}

{% block body %}
<div class="min-h-screen bg-slate-50">
    <nav class="bg-white border-b border-slate-200 px-6 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-800">生成活码</h1>
            <a href="/manage/live-codes" class="text-sm text-brand-600 hover:text-brand-700 font-medium">← 返回活码列表</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-8">
        <form method="post" action="/manage/live-code/create" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">选择文章 *</label>
                <select name="article_id" required
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all bg-white">
                    {% for article in articles %}
                    <option value="{{ article.id }}">{{ article.title }}</option>
                    {% else %}
                    <option value="" disabled>暂无文章，请先创建文章</option>
                    {% endfor %}
                </select>
                <p class="text-xs text-slate-400 mt-1">选择要生成活码的文章，一篇文章可生成多个活码</p>
            </div>

            <div class="bg-brand-50 border border-brand-200 rounded-lg p-4 mb-6">
                <p class="text-sm text-brand-800">
                    <strong>提示：</strong>生成后系统自动分配随机ID，您可以前往二维码配置页选择尺寸、Logo和边框文字。
                </p>
            </div>

            <div class="flex items-center justify-end gap-3">
                <a href="/manage/live-codes" class="px-4 py-2 text-slate-600 hover:text-slate-800 font-medium">取消</a>
                <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg transition-colors">
                    生成活码
                </button>
            </div>
        </form>
    </main>
</div>
{% endblock %}
