# 活码管理系统 - Nginx 配置
# 放置到 /etc/nginx/sites-available/livecode
# 然后: ln -s /etc/nginx/sites-available/livecode /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name hxy820.uno www.hxy820.uno;

    # 上传文件（本地存储）
    location /uploads/ {
        alias /var/www/livecode-system/uploads/;
        expires 7d;
    }

    # 静态文件
    location /static/ {
        alias /var/www/livecode-system/app/static/;
        expires 7d;
    }

    # 反向代理到 FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

