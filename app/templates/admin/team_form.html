{% extends "base.html" %}
{% block title %}{% if member %}编辑人员{% else %}新建人员{% endif %} - 活码管理系统{% endblock %}

{% block extra_css %}
<style>
    :root { --bg: #ffffff; --bg-alt: #f8f9fa; --card: #ffffff; --ink: #1a1a1a; --ink-soft: #666666; --line: #e5e5e5; }
    [data-theme="dark"] { --bg: #0a0a0a; --bg-alt: #111111; --card: #141414; --ink: #f0f0f0; --ink-soft: #888888; --line: #222222; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", sans-serif; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    .header { background: var(--bg); border-bottom: 1px solid var(--line); padding: 20px; }
    .header-inner { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 18px; font-weight: 700; }
    .nav { display: flex; gap: 20px; }
    .nav a { color: var(--ink-soft); font-size: 14px; }
    .nav a:hover { color: var(--ink); }
    .main { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
    .page-header { margin-bottom: 32px; }
    .page-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .form-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
    .form-label span { color: #c62828; margin-left: 2px; }
    .form-input { width: 100%; background: var(--bg-alt); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-input:focus { outline: none; border-color: var(--ink); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-hint { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 20px; border-top: 1px solid var(--line); margin-top: 8px; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--ink); color: var(--bg); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn-outline:hover { border-color: var(--ink); }
    .section-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
</style>
{% endblock %}

{% block body %}
<header class="header">
    <div class="header-inner">
        <a href="/" class="logo">活码管理系统</a>
        <nav class="nav">
            <a href="/manage/team" class="nav-link active">人员管理</a>
            <a href="/manage/projects" class="nav-link">项目管理</a>
            <a href="/" class="nav-link">首页</a>
        </nav>
    </div>
</header>

<main class="main">
    <div class="page-header">
        <h1 class="page-title">{% if member %}编辑人员{% else %}新建人员{% endif %}</h1>
    </div>

    <div class="form-card">
        <form id="memberForm">
            <!-- 基本信息 -->
            <div class="section-title">基本信息</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">姓名 <span>*</span></label>
                    <input type="text" id="name" name="name" required class="form-input"
                        placeholder="请输入姓名" value="{{ member.name if member else '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">职位</label>
                    <input type="text" id="position" name="position" class="form-input"
                        placeholder="例如：项目经理" value="{{ member.position if member else '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">部门</label>
                    <input type="text" id="department" name="department" class="form-input"
                        placeholder="例如：技术部" value="{{ member.department if member else '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">状态</label>
                    <select id="status" name="status" class="form-input">
                        <option value="active" {% if member and member.status == 'active' %}selected{% endif %}>在职</option>
                        <option value="inactive" {% if member and member.status == 'inactive' %}selected{% endif %}>离职</option>
                    </select>
                </div>
            </div>

            <!-- 联系方式 -->
            <div class="section-title" style="margin-top:24px;">联系方式</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" id="email" name="email" class="form-input"
                        placeholder="email@example.com" value="{{ member.email if member else '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">电话</label>
                    <input type="text" id="phone" name="phone" class="form-input"
                        placeholder="手机号码" value="{{ member.phone if member else '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">微信号</label>
                    <input type="text" id="wechat" name="wechat" class="form-input"
                        placeholder="微信号" value="{{ member.wechat if member else '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">头像 URL</label>
                    <input type="text" id="avatar_url" name="avatar_url" class="form-input"
                        placeholder="https://example.com/avatar.jpg" value="{{ member.avatar_url if member and member.avatar_url else '' }}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">个人简介</label>
                <textarea id="bio" name="bio" class="form-input form-textarea"
                    placeholder="人员简介内容..." rows="3">{{ member.bio if member else '' }}</textarea>
            </div>

            <!-- 名片扩展字段 -->
            <div class="section-title" style="margin-top:24px;">名片信息</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">年龄</label>
                    <input type="text" id="age" name="age" class="form-input"
                        placeholder="例如：28" value="{{ member.age if member else '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">标段</label>
                    <input type="text" id="section" name="section" class="form-input"
                        placeholder="例如：标段一" value="{{ member.section if member else '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">岗位</label>
                    <input type="text" id="post" name="post" class="form-input"
                        placeholder="例如：安全员" value="{{ member.post if member else '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">身份证号</label>
                    <input type="text" id="id_card" name="id_card" class="form-input"
                        placeholder="身份证号码" value="{{ member.id_card if member else '' }}">
                </div>
            </div>

            <div class="form-actions">
                <a href="/manage/team{% if member %}/{{ member.code }}{% endif %}" class="btn btn-outline">取消</a>
                <button type="submit" class="btn btn-primary">{% if member %}保存修改{% else %}创建人员{% endif %}</button>
            </div>
        </form>
    </div>
</main>

<script>
document.getElementById('memberForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const memberId = '{{ member.id if member else "" }}';
    const url = memberId ? `/api/v1/team/${memberId}` : '/api/v1/team';
    const method = memberId ? 'PUT' : 'POST';

    const body = {
        name: document.getElementById('name').value,
        position: document.getElementById('position').value || null,
        department: document.getElementById('department').value || null,
        email: document.getElementById('email').value || null,
        phone: document.getElementById('phone').value || null,
        wechat: document.getElementById('wechat').value || null,
        avatar_url: document.getElementById('avatar_url').value || null,
        bio: document.getElementById('bio').value || null,
        age: document.getElementById('age').value || null,
        section: document.getElementById('section').value || null,
        post: document.getElementById('post').value || null,
        id_card: document.getElementById('id_card').value || null,
        status: document.getElementById('status').value
    };

    const resp = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (resp.ok) {
        const data = resp.json();
        if (memberId) {
            window.location.href = '/manage/team/' + memberId;
        } else {
            window.location.href = '/manage/team';
        }
    } else {
        const err = await resp.json();
        alert('操作失败：' + (err.detail || '未知错误'));
    }
});
</script>
{% endblock %}
